<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tip splitter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Tip splitter</h1>
      <form id="bill">
        <label>Bill total <input id="total" type="number" min="0" step="0.01" value="60" /></label>
        <label>Tip percent <input id="tip" type="number" min="0" step="1" value="15" /></label>
        <label>People <input id="people" type="number" min="1" step="1" value="3" /></label>
      </form>
      <p id="result" role="status"></p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
